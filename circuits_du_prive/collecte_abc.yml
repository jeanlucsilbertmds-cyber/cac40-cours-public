# COLLECTE QUOTIDIENNE DES COURS DEPUIS ABC BOURSE — Jeu 10-09-2026
# Tourne sur une machine GitHub : réseau ouvert, page brute, aucun modèle entre la
# page et le programme. Décision de Jean-Luc du 10-09 (A-391), voie trouvée par lui.
# Horaire : il ne vit plus ici (voir plus bas) mais au circuit PUBLIC, fabriqué depuis ce
# fichier par programmes/FABRIQUER_LE_CIRCUIT_PUBLIC.py : quatre réveils, et
# programmes/FAUT_IL_TOURNER.py décide à l'heure de Paris (décision de Jean-Luc du
# 13-10-2026 : 18h07, secours 21h23, rattrapage 7h41). ABC sert la clôture du jour
# dès ~17h55 Paris (une observation, 09-09-2026). Se lance aussi à la main.
name: Collecte ABC Bourse
on:
  workflow_dispatch:
    inputs:
      rattrapage:
        # Coché, le passage saute la mesure de la performance. Jusqu'au 14-10-2026 il
        # servait au rattrapage du matin, parce que la mesure était datée du jour
        # d'horloge ; elle est désormais datée par sa séance (A-579, décision de
        # Jean-Luc du 14-10-2026 à 18h50) et aucun réveil planifié ne la saute.
        description: "Passage sans mesure de la performance"
        type: boolean
        default: false
  # L HORAIRE EST COUPE ICI LE 08-10-2026 (A-543, action ⑤) : le circuit du soir tourne
  # desormais depuis le depot PUBLIC `cac40-cours-public`, ou les machines de GitHub ne
  # coutent rien ; garder l horaire ici ferait tourner deux circuits le meme soir quand le
  # quota du depot prive reviendra. Le lancement a la main reste possible.
# UN SEUL CIRCUIT À LA FOIS (relecteur, 01-10-2026) : une relance à la main pendant le
# rattrapage du matin faisait tourner deux circuits qui poussent les mêmes fichiers. Le
# second attend la fin du premier. S'il en arrive un troisième pendant cette attente,
# celui qui attendait est annulé et le nouveau prend sa place (documentation de GitHub,
# « control workflow concurrency », relue le 13-10-2026) : sans dommage au circuit
# public, où le nouveau passage décide à son tour s'il doit tourner.
concurrency:
  group: circuit-du-soir
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # HISTORIQUE COMPLET — mesuré le 11-09 : par défaut checkout ne récupère
          # qu'un commit, et `git pull --rebase` échoue alors sur un dépôt tronqué.
          # Le push était rejeté « fetch first » et la collecte du jour perdue.
          fetch-depth: 0
      - name: Collecter les 40 valeurs et empiler dans donnees/claude_cours_nouveaux.csv
        id: collecte
        continue-on-error: true
        run: |
          set +e
          python3 programmes/COLLECTER_ABC_GITHUB.py "$GITHUB_WORKSPACE"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      # « [skip ci] » DANS CHAQUE MESSAGE DE COMMIT (A-543, 08-10-2026) : depuis le dépôt public, le
      # circuit pousse avec un jeton personnel, qui déclenche les circuits du dépôt privé
      # (certifier.yml, 75 minutes) ; le jeton de GitHub d'avant ne déclenchait rien.
      - name: Commiter ce qui a été écrit — cours et rapport
        id: commiter_ce_qui_a_ete_ecrit_cours_et_r
        run: |
          git config user.name "collecte-abc"
          git config user.email "collecte-abc@users.noreply.github.com"
          git add donnees/claude_cours_nouveaux.csv rapports/collecte_abc_*.md \
            || { echo "::error::git add A ECHOUE — un fichier manque ou a change de nom"; exit 1; }
          if git diff --cached --quiet; then
            echo "rien à commiter"
          else
            git commit -m "collecte ABC $(date -u +%Y-%m-%d) — code de sortie ${{ steps.collecte.outputs.code }} [skip ci]"
            # REBASE AVANT PUSH — Cowork, 10-09 : un push nu refusé sur collision (le Chat
            # ou Cowork pousse pendant les 40 pages) perdait le CSV avec la machine, et
            # la séance du jour n'était nulle part. R-736 : pull --rebase puis re-push.
            # jusqu'à trois essais : un push du Chat ou de Cowork pendant les
            # 40 pages fait rejeter le premier (R-736).
            # UN FICHIER SUIVI LAISSE EN PLAN EMPECHE LA POUSSEE — A-441, 22-09-2026.
            # `git pull --rebase` refuse de partir tant qu un fichier suivi est modifie
            # sans etre enregistre, et le message affiche ensuite etait « poussee
            # refusee », qui fait chercher une panne de connexion. On nomme donc ces
            # fichiers AVANT d essayer, et on s arrete en les nommant.
            RESTE=$(git diff --name-only)
            if [ -n "$RESTE" ]; then
              echo "::error::FICHIER(S) SUIVI(S) MODIFIE(S) SANS ETRE ENREGISTRE(S) — la poussee serait refusee : $RESTE"
              exit 1
            fi
            PARTI=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then PARTI=1; break; fi
              echo "essai $i refuse, nouvelle tentative"; sleep 5
            done
            if [ "$PARTI" -ne 1 ]; then
              echo "::error::POUSSEE REFUSEE 3 FOIS — la seance du jour n est nulle part"
              exit 1
            fi
          fi
      - name: Verser la seance du jour dans le fichier maitre
        id: versement
        # DEFAUT TROUVE PAR COWORK LE 14-09-2026, ET IL DURAIT DEPUIS LE 12-09.
        # **La collecte de 20h ecrivait la seance du jour dans
        # `claude_cours_nouveaux.csv`. Le detecteur, lui, lit le FICHIER MAITRE.
        # Personne ne versait l un dans l autre : `TENIR_L_HISTORIQUE.py` existe,
        # son en-tete dit « chaque soir, apres la collecte ABC », et AUCUN pas du
        # workflow ne l appelait.**
        # Mesure du 14-09 a 20h20 : 39 lignes du 14-09 collectees, ZERO dans le
        # maitre, et `signaux_du_jour.json` portait « seance : 2026-09-11 ».
        # **Le circuit a calcule les signaux de VENDREDI, et tous les pas etaient
        # verts.** Or une seance non lue le jour meme perd ses signaux pour
        # toujours : les cours se rattrapent, les signaux non.
        # PAS DE `continue-on-error` ICI : si le versement echoue, le detecteur
        # calculerait sur des cours perimes SANS LE DIRE. **Mieux vaut un
        # workflow rouge qu un signal faux.**
        run: |
          # ALERTE POUR JEAN-LUC (A-442, decision du 24-09-2026) : si le versement s arrete
          # sur le fichier maitre, il a ecrit rapports/ALERTE_FICHIER_MAITRE.md ; on la
          # depose AVANT d arreter le passage, pour que la tache du soir de Cowork la lise
          # a 23h et previenne Jean-Luc. Rien n est repare automatiquement.
          python3 programmes/TENIR_L_HISTORIQUE.py "$GITHUB_WORKSPACE" \
            || { echo "::error::LE FICHIER MAITRE N A PAS ETE ALIMENTE — le detecteur calculerait sur des cours perimes";
                 if [ -f rapports/ALERTE_FICHIER_MAITRE.md ]; then
                   git add rapports/ALERTE_FICHIER_MAITRE.md \
                     && git -c user.email=actions@github.com -c user.name=actions commit -m "ALERTE fichier maitre des cours — decision de Jean-Luc attendue [skip ci]" -- rapports/ALERTE_FICHIER_MAITRE.md \
                     && git push \
                     || echo "::error::L ALERTE DU FICHIER MAITRE N A PAS PU ETRE DEPOSEE";
                 fi;
                 exit 1; }
          # L ALERTE D UN SOIR PRECEDENT SE RANGE D ELLE-MEME (A-442) — cassure de Cowork,
          # 24-09-2026 : une alerte deposee restait au depot pour toujours, et la tache
          # de 23h aurait prevenu Jean-Luc chaque soir, meme apres la reparation. Un
          # versement reussi veut dire que les deux protections sont passees : le maitre
          # est complet. L alerte va aux archives, sous un nom qui dit « resolue le … ».
          if [ -f rapports/ALERTE_FICHIER_MAITRE.md ]; then
            RESOLUE="archives/ALERTE_FICHIER_MAITRE_resolue_$(TZ=Europe/Paris date +%d-%m-%Y_%Hh%M).md"
            mkdir -p archives
            mv rapports/ALERTE_FICHIER_MAITRE.md "$RESOLUE"
            printf '\n**RÉSOLUE le %s (Paris)** : le versement du soir est repassé, les deux protections du fichier maître aussi.\n' "$(TZ=Europe/Paris date '+%d-%m-%Y %Hh%M')" >> "$RESOLUE"
            git add "$RESOLUE" \
              && git rm -q --cached --ignore-unmatch rapports/ALERTE_FICHIER_MAITRE.md \
              || { echo "::error::L ALERTE RESOLUE N A PAS PU ETRE RANGEE AUX ARCHIVES"; exit 1; }
          fi
          git add donnees/cours_maitre.csv \
            || { echo "::error::git add cours_maitre A ECHOUE"; exit 1; }
          git -c user.email=actions@github.com -c user.name=actions \
            diff --cached --quiet || git -c user.email=actions@github.com \
            -c user.name=actions commit -m "seance du jour versee dans le fichier maitre [skip ci]"
          git push || { echo "::error::poussee du maitre refusee"; exit 1; }

      - name: Controler les valeurs attendues
        id: valeurs
        # JUSTE APRES LA COLLECTE, AVANT LE CALCUL — branche le 13-09-2026.
        # Il applique la regle I-9 : « un mnemonique attendu qui ne renvoie rien
        # est une ALERTE, jamais un silence ».
        # POURQUOI MAINTENANT : relance a la main ce jour-la, il a trouve en une
        # execution que **ARCELORMITTAL a disparu des cours le 11-09** — presente
        # le 9, presente le 10, absente le 11. La collecte a ramene 39 valeurs sur
        # 40 et personne ne l avait vu. **Les signaux auraient ete calcules sur un
        # univers ampute, sans erreur visible.**
        # `continue-on-error` : une valeur manquante ne doit pas empecher la
        # collecte du jour d etre sauvegardee — elle l est au pas precedent —
        # mais son echec est ANNONCE.
        # CC3 de Cowork, 13-09-2026 : **ce garde-fou n arretait rien, il annotait.**
        # `continue-on-error` le graciait, et le pas suivant tournait sans condition :
        # les signaux etaient calcules sur l univers ampute EXACTEMENT comme avant.
        # « La seule chose qui change est une ligne dans des journaux que personne
        #  ne lit. » **Cinquieme sortie de cette famille, et la premiere sur un
        #  garde-fou pose le jour meme.**
        # IL PORTE UN ID — mais PERSONNE NE LE LIT, et il faut le dire.
        # CC3 de Cowork, 13-09-2026 : mon commentaire affirmait « le calcul des
        # signaux le CONSULTE ». **C etait vrai une heure, puis Jean-Luc a demande
        # que le calcul continue sur les valeurs presentes — j ai retire la
        # condition et laisse le commentaire qui disait le contraire.**
        # L ID EST RETIRE. CC3 de Cowork, quatrieme pose du meme point :
        #   « le CODE 1 de ce soir a disparu parce que MA200-S1 a un univers, pas
        #    parce que le workflow a appris a juger. Le defaut est intact. »
        # J avais garde l id « pour si un jour ». **Un id que personne ne lit est
        # une promesse de condition qui n existe pas, et il a fait croire trois
        # fois a un garde-fou.** Jean-Luc a tranche que le calcul continue sur les
        # valeurs presentes : il n y a donc RIEN a conditionner, et l id doit
        # partir avec la condition qu il servait.
        # Ce qui protege reellement : `::error::` ci-dessous, qui rougit le pas.
        continue-on-error: true
        run: python3 "programmes/CONTROLER_LES_VALEURS_Lun_17-08-2026_18h20.py" "$GITHUB_WORKSPACE" || { echo "::error::CONTROLE DES VALEURS — au moins une valeur attendue manque"; exit 1; }

      - name: Détecter les signaux du jour — le calcul va où sont les données
        id: detecter_les_signaux_du_jour_le_calcul
        # LE CALCUL CONTINUE MEME SI UNE VALEUR MANQUE — Jean-Luc, 13-09-2026 :
        #   « si une valeur n est pas actualisee, on fait les calculs sur les
        #    autres, et on signale qu il manque cette valeur. »
        # **Il a raison et mon blocage etait faux** : les signaux se calculent
        # VALEUR PAR VALEUR, independamment. ARCELORMITTAL absente ne prive de
        # signal qu ELLE-MEME ; les 39 autres sont intactes. J avais arrete tout
        # le circuit — cockpit, positions, mesure, radar — pour un defaut qui ne
        # touche qu une ligne sur quarante.
        # **L alerte reste entiere : le pas precedent rougit et le dit. Ce qui
        # change, c est qu une alerte n est pas un arret.**
        # DÉCISION D'ARCHITECTURE (Jean-Luc, 11-09-2026) : la boucle transportait
        # 1,4 Mo de cours pour en tirer trois lignes. Ce transport a cassé deux fois
        # en deux jours — git bloqué, puis outil web qui tronque à ~49 Ko sans le dire.
        # GitHub a les cours et les programmes : il calcule, et publie le RÉSULTAT.
        # Le calibrage sur un signal connu est obligatoire : sans lui, rien n'est publié.
        run: python3 programmes/DETECTER_LES_SIGNAUX_GITHUB.py "$GITHUB_WORKSPACE"

      - name: Commiter les signaux
        id: commiter_les_signaux
        run: |
          git add donnees/signaux_du_jour.json \
            || { echo "::error::git add A ECHOUE — un fichier manque ou a change de nom"; exit 1; }
          if git diff --cached --quiet; then echo "signaux inchangés"; else
            git commit -m "signaux du jour $(date -u +%Y-%m-%d) [skip ci]"
            # V1 de Cowork, 12-09 : trois refus et LE PAS RESTAIT VERT. Le commit
            # existait en local, sur une machine jetable qui s efface a la fin du
            # passage — rien n arrivait au depot, et rien ne le disait. Plus grave
            # que le masque de ce matin : un programme crie avant de mourir, une
            # poussee refusee ne crie pas.
            # UN FICHIER SUIVI LAISSE EN PLAN EMPECHE LA POUSSEE — A-441, 22-09-2026.
            # `git pull --rebase` refuse de partir tant qu un fichier suivi est modifie
            # sans etre enregistre, et le message affiche ensuite etait « poussee
            # refusee », qui fait chercher une panne de connexion. On nomme donc ces
            # fichiers AVANT d essayer, et on s arrete en les nommant.
            RESTE=$(git diff --name-only)
            if [ -n "$RESTE" ]; then
              echo "::error::FICHIER(S) SUIVI(S) MODIFIE(S) SANS ETRE ENREGISTRE(S) — la poussee serait refusee : $RESTE"
              exit 1
            fi
            PARTI=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then PARTI=1; break; fi
              echo "essai $i refuse, nouvelle tentative"; sleep 5
            done
            if [ "$PARTI" -ne 1 ]; then
              echo "::error::POUSSEE REFUSEE 3 FOIS — le travail reste sur la machine jetable"
              exit 1
            fi
          fi

      - name: Tenir les positions
        id: tenir_les_positions
        # Le calcul va où sont les données : les positions, le journal des trades et
        # les stratégies vivent au dépôt. Plus aucune tâche Cowork n'est nécessaire.
        # LE MASQUE EST RETIRÉ — Cowork, 12-09-2026, et sa cassure domine toutes
        # les autres du tour : « il a réparé le programme, pas la raison pour
        # laquelle personne ne savait ». `|| echo` rendait code 0 sur un programme
        # effondré, avec un message qui AFFIRMAIT un état que personne n'avait
        # mesuré. La panne d'aujourd'hui a duré parce que ce masque existait ;
        # la prochaine aurait duré autant.
        run: python3 programmes/TENIR_LES_POSITIONS.py "$GITHUB_WORKSPACE"

      - name: Commiter positions et journal
        id: commiter_positions_et_journal
        run: |
          # V2 de Cowork : `2>/dev/null || true` envoyait l erreur au neant, l index
          # restait vide, et le pas affichait « positions inchangees » — UN ETAT QUE
          # PERSONNE N AVAIT MESURE. Meme forme que le `|| echo` retire ce matin dans
          # le pas voisin. Et D4 du plan prevoit justement de renommer ces fichiers.
          git add donnees/claude_positions_ouvertes.csv donnees/claude_journal_trades.csv donnees/historique_mesures.csv \
            || { echo "::error::git add A ECHOUE — un des fichiers manque ou a change de nom"; exit 1; }
          if git diff --cached --quiet; then echo "positions inchangées"; else
            git commit -m "positions $(date -u +%Y-%m-%d) [skip ci]"
            # V1 de Cowork, 12-09 : trois refus et LE PAS RESTAIT VERT. Le commit
            # existait en local, sur une machine jetable qui s efface a la fin du
            # passage — rien n arrivait au depot, et rien ne le disait. Plus grave
            # que le masque de ce matin : un programme crie avant de mourir, une
            # poussee refusee ne crie pas.
            # UN FICHIER SUIVI LAISSE EN PLAN EMPECHE LA POUSSEE — A-441, 22-09-2026.
            # `git pull --rebase` refuse de partir tant qu un fichier suivi est modifie
            # sans etre enregistre, et le message affiche ensuite etait « poussee
            # refusee », qui fait chercher une panne de connexion. On nomme donc ces
            # fichiers AVANT d essayer, et on s arrete en les nommant.
            RESTE=$(git diff --name-only)
            if [ -n "$RESTE" ]; then
              echo "::error::FICHIER(S) SUIVI(S) MODIFIE(S) SANS ETRE ENREGISTRE(S) — la poussee serait refusee : $RESTE"
              exit 1
            fi
            PARTI=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then PARTI=1; break; fi
              echo "essai $i refuse, nouvelle tentative"; sleep 5
            done
            if [ "$PARTI" -ne 1 ]; then
              echo "::error::POUSSEE REFUSEE 3 FOIS — le travail reste sur la machine jetable"
              exit 1
            fi
          fi

      - name: Fabriquer et publier le cockpit en page web
        id: fabriquer_et_publier_le_cockpit_en_pag
        env:
          GH_TOKEN: ${{ secrets.TOKEN_PUBLIC }}
          PHRASE: ${{ secrets.PHRASE_COCKPIT }}
        run: python3 programmes/PUBLIER_LE_SITE.py "$GITHUB_WORKSPACE"

      - name: Publier les cours et l'historique dans le dépôt PUBLIC
        id: publier_les_cours_et_l_historique_dans
        env:
          GH_TOKEN: ${{ secrets.TOKEN_PUBLIC }}
        run: python3 programmes/PUBLIER_AU_DEPOT_PUBLIC.py "$GITHUB_WORKSPACE"

      - name: Mesurer la performance
        id: mesure
        # Ces quatre programmes tournaient dans des tâches Cowork, qui ne peuvent
        # plus atteindre GitHub depuis le 11-09. Mesuré le 12-09 en suivant les
        # chaînes depuis le workflow : ils n'étaient lancés PAR PERSONNE — le radar
        # réparé six fois cette nuit ne tournait nulle part, et rien ne le disait.
        # `continue-on-error` reste — cette étape ne doit pas arrêter la
        # collecte — MAIS SON ÉCHEC EST DIT. Un pas rouge dans un passage
        # vert se voit ; un pas vert sur un programme effondré, non.
        continue-on-error: true
        # SAUTÉE QUAND LA CASE `rattrapage` EST COCHÉE (entrée en tête), par la commande et
        # non par un `if:` : aucun pas entre le cockpit et le radar ne porte de `if:`, pour
        # qu'une panne du cockpit arrête toujours le passage avant le radar
        # (tests/EPREUVES_DU_COCKPIT_AU_RADAR_Mer_30-09-2026.py, E3).
        run: |
          if [ "${{ inputs.rattrapage }}" = "true" ]; then echo "mesure sautée : case « rattrapage » cochée"; exit 0; fi
          python3 "programmes/MESURER_LA_PERFORMANCE_Lun_17-08-2026_19h30.py" "$GITHUB_WORKSPACE" || { echo "::error::Mesurer la performance A ÉCHOUÉ"; exit 1; }

      - name: Fabriquer le PILOTE
        id: pilote
        # `continue-on-error` reste — cette étape ne doit pas arrêter la
        # collecte — MAIS SON ÉCHEC EST DIT. Un pas rouge dans un passage
        # vert se voit ; un pas vert sur un programme effondré, non.
        continue-on-error: true
        run: python3 programmes/claude_FABRIQUER_LE_PILOTE.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/gouvernance/PILOTE.md" || { echo "::error::Fabriquer le PILOTE A ÉCHOUÉ"; exit 1; }

      - name: Confronter les fichiers a leurs contrats
        id: contrats
        # LES DIX FICHIERS DE LIAISON DECLARENT LEURS CHAMPS — methode de la
        # photographie v3, « ce qui se partage se declare ».
        # Un seul les declarait ce matin ; les neuf autres ont ete releves SUR
        # LE FICHIER VIVANT le 13-09, jamais de memoire.
        # **CE PAS EST CE QUI DONNE LEUR VALEUR AUX CONTRATS** : sans lui, un
        # contrat est une declaration d intention et le fichier peut deriver
        # sans que rien ne le dise. Eprouve le 13-09 par sabotage : une colonne
        # renommee et une colonne ajoutee rendent trois ecarts nommes.
        # `continue-on-error` : un ecart de champ n est pas forcement une
        # regression — ce peut etre une evolution voulue. **Il rougit, il
        # n arrete pas. Trancher appartient a Jean-Luc.**
        continue-on-error: true
        run: python3 programmes/CONFRONTER_AUX_CONTRATS.py "$GITHUB_WORKSPACE" || { echo "::error::CONTRATS — au moins un fichier ne porte plus les champs de son contrat"; exit 1; }

      - name: Passer le radar sur l ecosysteme
        id: radar
        continue-on-error: true
        run: |
          # U1 de Cowork, 12-09 : `set +e` puis `|| true` en derniere commande —
          # LE PAS REUSSISSAIT QUOI QU IL ARRIVE, et rien n etait annonce. Mon
          # propre comptage disait « 0 pas masque » : il cherchait `|| echo` et
          # ratait cette forme-la. **C etait un sur cinq, et c est le seul
          # programme dont le metier est de rendre les fautes visibles.**
          set +e
          python3 programmes/audit_ecosysteme.py "$GITHUB_WORKSPACE" > rapports/audit_du_jour.md 2>&1
          CODE=$?
          echo "radar : code $CODE"
          # CC2 de Cowork, 13-09-2026 : ces deux motifs cherchaient « ^OK » et
          # « ^ECHEC » dans un rapport qui n ecrit QUE des emojis. Mesure :
          #   grep -c "^OK"    -> 0        grep -c "✅" -> 44
          #   grep -c "^ECHEC" -> 0        grep -c "❌" -> 0
          # **Le compteur affichait zero quoi qu il arrive, et un ❌ n aurait
          # JAMAIS ete affiche.** C est le seul programme dont le metier est de
          # rendre les fautes visibles, et son pas les taisait.
          # Meme famille que « chercher un mot au lieu d une propriete », quatre
          # fois aujourd hui — ici le motif ne correspondait meme pas au format.
          echo "verts   : $(grep -c '✅' rapports/audit_du_jour.md || echo 0)"
          echo "alertes : $(grep -c '⚠️' rapports/audit_du_jour.md || echo 0)"
          grep '^❌' rapports/audit_du_jour.md || echo "echecs  : aucun"
          if [ "$CODE" -ne 0 ]; then echo "::error::Passer le radar A ECHOUE (code $CODE)"; exit 1; fi

      - name: Calculer la meteo du marche
        id: meteo
        # VOYANT « MOYENNE DES 200 SÉANCES » DU CAC 40 (A-615), décision de Jean-Luc du 29-10-2026
        # à 13h39 (« Faire la moyenne »), après l'étude PLAN_PREVOIR_ET_SE_PROTEGER_CAC40_INDICE.
        # Lit la page de l'indice chez ABC (PX1p) et écrit rapports/meteo_du_marche.md.
        # `continue-on-error` : un voyant ne doit pas arrêter la collecte, MAIS SON ÉCHEC EST DIT.
        continue-on-error: true
        run: python3 programmes/METEO_DU_MARCHE.py "$GITHUB_WORKSPACE" || { echo "::error::Calculer la météo du marché A ÉCHOUÉ — lire rapports/meteo_du_marche.md"; exit 1; }

      - name: Commiter mesures, PILOTE et rapport du radar
        id: commiter_mesures_pilote_et_rapport_du_
        run: |
          # LE PAS QUI COMMITE LE RAPPORT DU RADAR ETAIT LE SEUL A SE TAIRE.
          # Cowork, 13-09-2026 : « deux pas de commit traitent la meme faute de
          # deux facons opposees — celui qui se tait est justement celui qui
          # commite le rapport du radar. » **Si cet ajout echoue, Jean-Luc lit le
          # rapport de la veille en croyant lire celui du jour.**
          # A-441, 22-09-2026 : `rapports/AUDIT_ECOSYSTEME.md` est entre au depot le
          # 17-09-2026 a 21h29, et le radar le reecrit chaque soir. Il n etait pas dans
          # cette liste : `git pull --rebase` refusait alors de partir avec un fichier
          # suivi laisse en plan, trois fois, et les mesures, le PILOTE et le rapport du
          # radar ne sont plus arrives au depot du 18 au 22-09-2026.
          git add donnees/historique_mesures.csv gouvernance/PILOTE.md rapports/audit_du_jour.md \
                  rapports/AUDIT_ECOSYSTEME.md \
                  rapports/meteo_du_marche.md donnees/meteo_du_marche.csv donnees/indice_cac40_quotidien.csv \
            || { echo "::error::git add A ECHOUE — un fichier manque ou a change de nom"; exit 1; }
          # C EST LE DERNIER ENREGISTREMENT DU PASSAGE : un fichier suivi encore
          # modifie ici est perdu, qu il y ait autre chose a enregistrer ou non.
          # On le nomme donc AVANT de savoir s il y a du neuf — A-441, 22-09-2026 :
          # l essai de sabotage l a montre, place plus bas il se taisait les soirs
          # sans rien de neuf.
          OUBLIES=$(git diff --name-only)
          if [ -n "$OUBLIES" ]; then
            echo "::error::FICHIER(S) SUIVI(S) MODIFIE(S) PAR LE PASSAGE ET JAMAIS ENREGISTRE(S) — ils seraient perdus : $OUBLIES"
            exit 1
          fi
          if git diff --cached --quiet; then echo "rien de neuf"; else
            git commit -m "mesures, pilote et radar $(date -u +%Y-%m-%d) [skip ci]"
            # V1 de Cowork, 12-09 : trois refus et LE PAS RESTAIT VERT. Le commit
            # existait en local, sur une machine jetable qui s efface a la fin du
            # passage — rien n arrivait au depot, et rien ne le disait. Plus grave
            # que le masque de ce matin : un programme crie avant de mourir, une
            # poussee refusee ne crie pas.
            # UN FICHIER SUIVI LAISSE EN PLAN EMPECHE LA POUSSEE — A-441, 22-09-2026.
            # `git pull --rebase` refuse de partir tant qu un fichier suivi est modifie
            # sans etre enregistre, et le message affiche ensuite etait « poussee
            # refusee », qui fait chercher une panne de connexion. On nomme donc ces
            # fichiers AVANT d essayer, et on s arrete en les nommant.
            RESTE=$(git diff --name-only)
            if [ -n "$RESTE" ]; then
              echo "::error::FICHIER(S) SUIVI(S) MODIFIE(S) SANS ETRE ENREGISTRE(S) — la poussee serait refusee : $RESTE"
              exit 1
            fi
            PARTI=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then PARTI=1; break; fi
              echo "essai $i refuse, nouvelle tentative"; sleep 5
            done
            if [ "$PARTI" -ne 1 ]; then
              echo "::error::POUSSEE REFUSEE 3 FOIS — le travail reste sur la machine jetable"
              exit 1
            fi
          fi

      - name: Échouer bruyamment si la collecte a échoué
        id: echouer_bruyamment_si_la_collecte_a_ec
        if: steps.collecte.outputs.code != '0'
        run: |
          echo "::error::collecte ABC terminée avec le code ${{ steps.collecte.outputs.code }} — lire rapports/collecte_abc_*.md"
          exit 1

      - name: Dire quels pas non bloquants sont tombes
        id: dire_quels_pas_non_bloquants_sont_tomb
        # DEFAUT NOMME PAR JEAN-LUC LE 16-09-2026 : « ces etapes peuvent tomber
        # sans que rien ne s allume, le passage reste vert. »
        # **Les pas en `continue-on-error` CRIENT deja, chacun porte son
        # ::error::. Ce qui manquait : PERSONNE NE RASSEMBLAIT leurs echecs.**
        # Mesure du 16-09 : trois jours sans PILOTE ni rapport du radar, et tous
        # les passages VERTS.
        #
        # LA PREMIERE VERSION EPELAIT CINQ IDENTIFIANTS A LA MAIN — cassure de
        # Cowork, tour 54. **Le fichier en porte SIX : `collecte` etait deja
        # dehors le jour de l ecriture, et le verdict annoncait « les cinq pas
        # non bloquants ont tous abouti » — il nommait un tout en comptant une
        # partie.** Le §7 donne le critere : REPARER PAR UNE PROPRIETE, JAMAIS
        # PAR UNE ENUMERATION. La question qui tranche : **si j ajoute un pas
        # non bloquant demain, le verdict le voit-il ?**
        #
        # **`toJSON(steps)` rend TOUS les pas porteurs d un id, avec leur issue.
        # Le verdict lit cette table : il ne connait aucun nom, donc il ne peut
        # en oublier aucun.** Un pas ajoute demain y entre sans qu on y touche.
        # IL NE BLOQUE PAS : l intention du `continue-on-error` reste intacte —
        # un defaut d audit n empeche pas la collecte des cours.
        if: always()
        env:
          PAS: ${{ toJSON(steps) }}
        run: |
          # LE CONTROLE DE DATE DES DEUX FICHIERS DU RITUEL — branche ici, 17-09.
          # **Il existait depuis le matin et AUCUN pas ne l appelait** : ecrit dans
          # `CONTRATS_DES_FICHIERS.py`, il n etait atteint ni par `confronter_tous`,
          # que le pas des contrats invoque, ni par rien d autre.
          # **POURQUOI ICI ET PAS AU PAS DES CONTRATS** : ce pas-la tourne AVANT le
          # radar, et c est le radar qui ecrit `rapports/audit_du_jour.md`. A ce
          # moment le fichier porte encore la date de la veille — **le controle
          # echouerait CHAQUE SOIR.** Le verdict est le dernier pas : les deux
          # fichiers y sont ecrits.
          # LE CODE QUI VIVAIT ICI EST DANS UN PROGRAMME depuis le 08-10-2026 (A-543 : aucun code
          # Python dans le fichier du circuit, qui devient public), repris tel quel.
          python3 programmes/DIRE_LES_PAS_TOMBES.py "$GITHUB_WORKSPACE"
