          git push -q origin "HEAD:refs/heads/series-longues/${GITHUB_RUN_ID}/${SERIE}/releve" \
            || { echo "::error::POUSSEE REFUSEE — le releve reste sur la machine jetable"; exit 1; }
          echo "depose sur sa branche"
