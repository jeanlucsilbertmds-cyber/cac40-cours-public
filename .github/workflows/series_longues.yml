          T=$(mktemp -d)
          [[ "$SERIE" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::valeur refusee pour SERIE (lettres, chiffres, _ et - seulement)"; exit 1; }
          mkdir -p rapports/series_longues
          for f in rapports/journal_du_circuit/circuit_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${GITHUB_JOB}.log; do
