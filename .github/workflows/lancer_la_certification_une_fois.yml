# LANCEMENT UNIQUE DE LA CERTIFICATION — écrit à la main par le Chat, HORS du fabricant.
# Décision de Jean-Luc du 07-11-2026 à 15h57 (ses mots : « Tu crées un autre lancement unique
# maintenant. Si tu es sûr qu'il y a du retard et qu'il ne va pas partir tout de suite, c'est pas
# grave, tu y partiras quand il partira. »). Raison : la certification de la nuit du 06 au 07-11
# n'a pas rendu de verdict (fusion tombée pendant l'examen, n°302), et elle ne part seule que les
# soirs de semaine. Ce fichier ne modifie RIEN de ce qui existe : il demande UN passage du circuit
# « Certifier la version » (certifier_la_version.yml), exactement comme le bouton « Run workflow ».
# Il part une fois, à la poussée de ce fichier. Il sera retiré après le verdict.
name: Lancer la certification une fois
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lancer_la_certification_une_fois.yml"
permissions:
  actions: write
  contents: read
jobs:
  lancer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Demander un passage de Certifier la version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run certifier_la_version.yml --ref main
