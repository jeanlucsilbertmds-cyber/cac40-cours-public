# DEMANDE DE SERIE — LE RELAIS — FICHIER FABRIQUÉ, NE PAS ÉCRIRE À LA MAIN.
# Fabriqué par programmes/FABRIQUER_LE_CIRCUIT_PUBLIC.py. Simulation uniquement.
# À QUOI IL SERT. Lancer le circuit des séries longues (series_longues.yml), les épreuves longues d'un tenant
# (epreuves_longues.yml) ou l'examen de certification (certifier_la_version.yml, depuis main), sans que Jean-Luc clique
# sur « Run workflow » : le Chat dépose un fichier de demande (programmes/DEPOSER_UNE_DEMANDE.py), ce relais l'examine
# et appuie AUSSITÔT sur le bouton du circuit demandé (table CIRCUITS_DU_RELAIS du fabricant). La file d'attente est
# celle de GitHub (« queue: max » des places du réservoir, décision A-896, étape FILE-2) : le relais ne garde rien, ne
# relance rien. Le passage lancé porte l'identifiant de la demande dans son titre.
# CE QU'IL FAIT, DANS L'ORDRE : ① la poussée (ou, au bouton, le dernier commit de la branche) porte UN commit, dont le
# parent est la pointe d'avant, qui AJOUTE UN seul fichier, demandes/DEMANDE_<AAAA-MM-JJ_HHhMM>.txt, de moins de
# 24 h ; ② le fichier est lu en ASCII strict, une clé par ligne, clés connues seulement, « version » égale
# à la branche ; ③ la fiche du circuit visé, sur cette branche, est une file (« queue: max », sans « cancel-in-progress:
# true »), et le relais de la branche est une file du groupe demande-de-serie-en-file ; ④ pour un circuit long, il CHOISIT
# LES PLACES (étape FILE-2, 20-11-2026) : la charge de chaque place lue dans le titre des passages en cours ou en attente
# des trois circuits (« … places <p>+<n> »), la fenêtre de places consécutives la moins chargée ; jamais un refus pour
# un passage en cours ; ⑤ « a_blanc=oui » : il écrit au journal ce qu'il aurait lancé et s'arrête ; sinon il lance le
# circuit. Un refus rougit le passage.
# CE QU'IL N'A PAS : aucune clé du dépôt privé, aucun clonage du privé, aucun programme de la version lancé (seulement
# des commandes du système et gh) ; permissions : lire le dépôt, lancer un circuit. Ce texte a été relu ; le
# fabricant refuse de publier un relais qui n'est pas ce texte, octet pour octet (empreinte), et tout autre circuit
# qui porterait la permission de lancer.
name: Demande de serie (relais)
on:
  push:
    paths:
      - "demandes/**"
  workflow_dispatch:
concurrency:
  group: demande-de-serie-en-file
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
  actions: write
jobs:
  relayer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Lire la demande, la valider, appuyer sur le bouton
        id: relayer
        shell: bash
        env:
          EVENEMENT: ${{ github.event_name }}
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.sha }}
          BRANCHE: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u -o pipefail
          export LC_ALL=C
          D=$(mktemp -d)
          # EXAMINER LA DEMANDE (la forme du commit qui l'ajoute, son nom et son âge, son contenu, la fiche du circuit
          # visé), en sous-shell : un refus sort par « exit 1 » avec son message ; une demande valide écrit dans $S les
          # arguments de « gh workflow run » (un par ligne). Le même texte est joué par programmes/DEPOSER_UNE_DEMANDE.py.
          examiner() {
          AVANT="$1"
          APRES="$2"
          BRANCHE="$3"
          S="$4"
          mkdir -p "$S" || { echo "::error::DEMANDE REFUSEE : dossier de travail impossible"; exit 1; }
          [[ "$BRANCHE" =~ ^(main|travail-[A-Za-z0-9._-]+)$ ]] || { echo "::error::DEMANDE REFUSEE : branche hors de la forme permise (main, ou une version en attente travail-...)"; exit 1; }
          [[ "$AVANT" =~ ^[0-9a-f]{40}$ ]] && [[ "$AVANT" =~ [1-9a-f] ]] || { echo "::error::DEMANDE REFUSEE : pas de pointe d'avant (branche creee par cette poussee ?) : publier le code d'abord, puis la demande seule"; exit 1; }
          parent=$(git rev-parse -q --verify "$APRES^1") || { echo "::error::DEMANDE REFUSEE : commit sans parent lisible"; exit 1; }
          [ "$parent" = "$AVANT" ] || { echo "::error::DEMANDE REFUSEE : la poussee porte plus d'un commit ; la demande se depose seule, dans un commit a elle"; exit 1; }
          [ -z "$(git rev-parse -q --verify "$APRES^2" || true)" ] || { echo "::error::DEMANDE REFUSEE : commit de fusion"; exit 1; }
          changes=$(git diff-tree --no-commit-id --no-renames -r --name-status "$AVANT" "$APRES") || { echo "::error::DEMANDE REFUSEE : changements illisibles"; exit 1; }
          [ "$(printf '%s\n' "$changes" | grep -c .)" = "1" ] || { echo "::error::DEMANDE REFUSEE : la poussee doit ajouter UN seul fichier, sous demandes/ ; elle en touche $(printf '%s\n' "$changes" | grep -c .)"; exit 1; }
          statut=$(printf '%s\n' "$changes" | cut -f1)
          fichier=$(printf '%s\n' "$changes" | cut -f2-)
          [ "$statut" = "A" ] || { echo "::error::DEMANDE REFUSEE : le fichier n'est pas ajoute (etat $statut)"; exit 1; }
          [[ "$fichier" =~ ^demandes/DEMANDE_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}h[0-9]{2}[.]txt$ ]] || { echo "::error::DEMANDE REFUSEE : nom refuse (demandes/DEMANDE_AAAA-MM-JJ_HHhMM.txt)"; exit 1; }
          HEURE_DU_NOM="${fichier#demandes/DEMANDE_}"
          HEURE_DU_NOM="${HEURE_DU_NOM%.txt}"
          quand=$(TZ=Europe/Paris date -d "${HEURE_DU_NOM:0:10} ${HEURE_DU_NOM:11:2}:${HEURE_DU_NOM:14:2}" +%s 2>/dev/null) || quand=""
          [[ "$quand" =~ ^[0-9]+$ ]] || { echo "::error::DEMANDE REFUSEE : heure du nom illisible"; exit 1; }
          [ $(( $(date +%s) - quand )) -le 86400 ] || { echo "::error::DEMANDE REFUSEE : nom de plus de 24 h (heure de Paris)"; exit 1; }
          [ $(( quand - $(date +%s) )) -le 600 ] || { echo "::error::DEMANDE REFUSEE : nom dans le futur (heure de Paris)"; exit 1; }
          taille=$(git cat-file -s "$APRES:$fichier") || { echo "::error::DEMANDE REFUSEE : fichier illisible"; exit 1; }
          [[ "$taille" =~ ^[0-9]{1,4}$ ]] && [ "$taille" -le 1000 ] || { echo "::error::DEMANDE REFUSEE : plus de 1000 octets"; exit 1; }
          git cat-file blob "$APRES:$fichier" > "$S/demande.txt" || { echo "::error::DEMANDE REFUSEE : fichier illisible"; exit 1; }
          hors=$(tr -d ' -~\n' < "$S/demande.txt" | wc -c)
          [ "$hors" = "0" ] || { echo "::error::DEMANDE REFUSEE : $hors octet(s) hors de l'ASCII imprimable (accent, tabulation, retour chariot, caractere de controle)"; exit 1; }
          vus=" "
          CIRCUIT=""
          SERIE=""
          POINTE=""
          EPREUVES=""
          A_BLANC="non"
          VERSION=""
          PARTS_YAHOO=2
          LOT_YAHOO=21
          PARTS_HL=18
          LOT_HL=6
          PARTS_BOUCLE=3
          LOT_BOUCLE=6
          PARTS_SIGNAUX=2
          LOT_SIGNAUX=21
          PARTS_DEBUTS=4
          LOT_DEBUTS=6
          PARTS_SIGNAL=4
          LOT_SIGNAL=6
          while IFS= read -r ligne || [ -n "$ligne" ]; do
            [ -n "$ligne" ] && [[ "$ligne" != "#"* ]] || continue
            if [[ "$ligne" == version=* ]]; then
              valeur="${ligne#version=}"
              [[ "$valeur" =~ ^(main|travail-[A-Za-z0-9._-]+)$ ]] || { echo "::error::DEMANDE REFUSEE : version hors de la forme permise (main, ou une version en attente travail-...)"; exit 1; }
              [[ "$vus" != *" version "* ]] || { echo "::error::DEMANDE REFUSEE : cle donnee deux fois : version"; exit 1; }
              vus="${vus}version "
              VERSION="$valeur"
              continue
            fi
            if [[ "$ligne" == pointe=* ]]; then
              valeur="${ligne#pointe=}"
              [[ "$valeur" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::DEMANDE REFUSEE : pointe de 40 caracteres hexadecimaux en minuscules (${#valeur} caractere(s) recus)"; exit 1; }
              [[ "$vus" != *" pointe "* ]] || { echo "::error::DEMANDE REFUSEE : cle donnee deux fois : pointe"; exit 1; }
              vus="${vus}pointe "
              POINTE="$valeur"
              continue
            fi
            if [[ "$ligne" == epreuves=* ]]; then
              valeur="${ligne#epreuves=}"
              [[ "$valeur" =~ ^(toutes|[A-Za-z][A-Za-z0-9]{0,19}(,[A-Za-z][A-Za-z0-9]{0,19})*)$ ]] || { echo "::error::DEMANDE REFUSEE : epreuves = toutes, ou des codes separes par des virgules (${#valeur} caractere(s) recus)"; exit 1; }
              [[ "$vus" != *" epreuves "* ]] || { echo "::error::DEMANDE REFUSEE : cle donnee deux fois : epreuves"; exit 1; }
              vus="${vus}epreuves "
              if [ "$valeur" != "toutes" ]; then
                deja=" "
                for c in ${valeur//,/ }; do
                  [[ " CircuitSeries CircuitPublic Relais NuitDecoupee Certification VenteUnique MessageDuSoir VingtAns RegistreEssais Bloc5A DossierLancement RegistreStrategies CircuitLecteur JugeLecteur Tri Moulinette ArriveeSignaux LectureCours PorteEntree Comblement VeriteJuge SeanceAchat VenteReglable ContratSabot Comptabilites BaremeFrais LectureFiche GardeFou Confrontation JeuRadar RsiRebond SoirFiche TroisElements CopieBoucles MoulinetteEssai File LivrerSabots ContratNuit ChaineC5 Enchainer SoirDecide NomsContrat Carte AncreC5 Calibrage EcartDeGain EtatTravaux EtatTravauxSabot ProprietesChaine ProprietesSabot ProprietesSuite ProprietesSuiteSabot ProprietesBout ProprietesBoutSabot " == *" $c "* ]] || { echo "::error::DEMANDE REFUSEE : epreuve inconnue : $c"; exit 1; }
                  [[ "$deja" != *" $c "* ]] || { echo "::error::DEMANDE REFUSEE : epreuve demandee deux fois : $c"; exit 1; }
                  deja="$deja$c "
                done
              fi
              EPREUVES="$valeur"
              continue
            fi
            [[ "$ligne" =~ ^([a-z_]{1,20})=([A-Za-z0-9]{1,20})$ ]] || { echo "::error::DEMANDE REFUSEE : ligne illisible (cle=valeur, lettres et chiffres, sans espace ; ${#ligne} caractere(s))"; exit 1; }
            cle="${BASH_REMATCH[1]}"
            valeur="${BASH_REMATCH[2]}"
            [[ "$vus" != *" $cle "* ]] || { echo "::error::DEMANDE REFUSEE : cle donnee deux fois : $cle"; exit 1; }
            vus="$vus$cle "
            if [ "$cle" = "circuit" ]; then
              [[ "$valeur" =~ ^(series|examen|epreuve)$ ]] || { echo "::error::DEMANDE REFUSEE : circuit inconnu (series ou examen ou epreuve)"; exit 1; }
              CIRCUIT="$valeur"
            elif [ "$cle" = "serie" ]; then
              [[ "$valeur" =~ ^(toutes|Yahoo|HL|Boucle|Signaux|Debuts|Signal)$ ]] || { echo "::error::DEMANDE REFUSEE : serie inconnue de la table"; exit 1; }
              SERIE="$valeur"
            elif [ "$cle" = "a_blanc" ]; then
              [[ "$valeur" =~ ^(oui|non)$ ]] || { echo "::error::DEMANDE REFUSEE : a_blanc vaut oui ou non"; exit 1; }
              A_BLANC="$valeur"
            elif [ "$cle" = "parts_yahoo" ]; then
              [[ "$valeur" =~ ^[1-9][0-9]?$ ]] || { echo "::error::DEMANDE REFUSEE : parts_yahoo de 1 a 99"; exit 1; }
              PARTS_YAHOO="$valeur"
            elif [ "$cle" = "lot_yahoo" ]; then
              [[ "$valeur" =~ ^[1-9][0-9]?$ ]] || { echo "::error::DEMANDE REFUSEE : lot_yahoo de 1 a 99"; exit 1; }
              LOT_YAHOO="$valeur"
            elif [ "$cle" = "parts_hl" ]; then
              [[ "$valeur" =~ ^[1-9][0-9]?$ ]] || { echo "::error::DEMANDE REFUSEE : parts_hl de 1 a 99"; exit 1; }
              PARTS_HL="$valeur"
            elif [ "$cle" = "lot_hl" ]; then
              [[ "$valeur" =~ ^[1-9][0-9]?$ ]] || { echo "::error::DEMANDE REFUSEE : lot_hl de 1 a 99"; exit 1; }
              LOT_HL="$valeur"
            elif [ "$cle" = "parts_boucle" ]; then
              [[ "$valeur" =~ ^[1-9][0-9]?$ ]] || { echo "::error::DEMANDE REFUSEE : parts_boucle de 1 a 99"; exit 1; }
              PARTS_BOUCLE="$valeur"
            elif [ "$cle" = "lot_boucle" ]; then
              [[ "$valeur" =~ ^[1-9][0-9]?$ ]] || { echo "::error::DEMANDE REFUSEE : lot_boucle de 1 a 99"; exit 1; }
              LOT_BOUCLE="$valeur"
            elif [ "$cle" = "parts_signaux" ]; then
              [[ "$valeur" =~ ^[1-9][0-9]?$ ]] || { echo "::error::DEMANDE REFUSEE : parts_signaux de 1 a 99"; exit 1; }
              PARTS_SIGNAUX="$valeur"
            elif [ "$cle" = "lot_signaux" ]; then
              [[ "$valeur" =~ ^[1-9][0-9]?$ ]] || { echo "::error::DEMANDE REFUSEE : lot_signaux de 1 a 99"; exit 1; }
              LOT_SIGNAUX="$valeur"
            elif [ "$cle" = "parts_debuts" ]; then
              [[ "$valeur" =~ ^[1-9][0-9]?$ ]] || { echo "::error::DEMANDE REFUSEE : parts_debuts de 1 a 99"; exit 1; }
              PARTS_DEBUTS="$valeur"
            elif [ "$cle" = "lot_debuts" ]; then
              [[ "$valeur" =~ ^[1-9][0-9]?$ ]] || { echo "::error::DEMANDE REFUSEE : lot_debuts de 1 a 99"; exit 1; }
              LOT_DEBUTS="$valeur"
            elif [ "$cle" = "parts_signal" ]; then
              [[ "$valeur" =~ ^[1-9][0-9]?$ ]] || { echo "::error::DEMANDE REFUSEE : parts_signal de 1 a 99"; exit 1; }
              PARTS_SIGNAL="$valeur"
            elif [ "$cle" = "lot_signal" ]; then
              [[ "$valeur" =~ ^[1-9][0-9]?$ ]] || { echo "::error::DEMANDE REFUSEE : lot_signal de 1 a 99"; exit 1; }
              LOT_SIGNAL="$valeur"
            else
              echo "::error::DEMANDE REFUSEE : cle inconnue : $cle"
              exit 1
            fi
          done < "$S/demande.txt"
          [ -n "$VERSION" ] || { echo "::error::DEMANDE REFUSEE : la cle version manque (le nom de la branche de la demande)"; exit 1; }
          [ "$VERSION" = "$BRANCHE" ] || { echo "::error::DEMANDE REFUSEE : la version n'est pas la branche de la demande"; exit 1; }
          [ -n "$CIRCUIT" ] || { echo "::error::DEMANDE REFUSEE : la cle circuit manque (series ou examen ou epreuve)"; exit 1; }
          FICHIER=""
          if [ "$CIRCUIT" = "series" ]; then
            FICHIER="series_longues.yml"
            [[ "$BRANCHE" =~ ^(main|travail-[A-Za-z0-9._-]+)$ ]] || { echo "::error::DEMANDE REFUSEE : le circuit series ne se lance pas depuis cette branche"; exit 1; }
          fi
          if [ "$CIRCUIT" = "examen" ]; then
            FICHIER="certifier_la_version.yml"
            [[ "$BRANCHE" =~ ^main$ ]] || { echo "::error::DEMANDE REFUSEE : le circuit examen ne se lance pas depuis cette branche"; exit 1; }
          fi
          if [ "$CIRCUIT" = "epreuve" ]; then
            FICHIER="epreuves_longues.yml"
            [[ "$BRANCHE" =~ ^(main|travail-[A-Za-z0-9._-]+)$ ]] || { echo "::error::DEMANDE REFUSEE : le circuit epreuve ne se lance pas depuis cette branche"; exit 1; }
          fi
          [ -n "$FICHIER" ] || { echo "::error::DEMANDE REFUSEE : circuit sans fichier : $CIRCUIT"; exit 1; }
          if [ "$CIRCUIT" = "examen" ]; then
            for k in $vus; do
              [[ " circuit version a_blanc " == *" $k "* ]] || { echo "::error::DEMANDE REFUSEE : le circuit $CIRCUIT ne prend aucun reglage (seulement circuit, version et a_blanc) :$vus"; exit 1; }
            done
          fi
          if [ "$CIRCUIT" = "epreuve" ]; then
            for k in $vus; do
              [[ " circuit version epreuves pointe a_blanc " == *" $k "* ]] || { echo "::error::DEMANDE REFUSEE : le circuit epreuve ne prend que circuit, version, epreuves, pointe et a_blanc : $k"; exit 1; }
            done
            [ -n "$EPREUVES" ] || { echo "::error::DEMANDE REFUSEE : la cle epreuves manque"; exit 1; }
            [ "$BRANCHE" = "main" ] || [ -n "$POINTE" ] || { echo "::error::DEMANDE REFUSEE : la cle pointe manque (obligatoire depuis une version en attente, A-811)"; exit 1; }
          fi
          [ "$CIRCUIT" = "epreuve" ] || [ -z "$EPREUVES" ] || { echo "::error::DEMANDE REFUSEE : la cle epreuves ne vaut que pour le circuit epreuve"; exit 1; }
          [ "$CIRCUIT" != "series" ] || [ -n "$SERIE" ] || { echo "::error::DEMANDE REFUSEE : la cle serie manque"; exit 1; }
          [ "$CIRCUIT" != "series" ] || [ "$BRANCHE" = "main" ] || [ -n "$POINTE" ] || { echo "::error::DEMANDE REFUSEE : la cle pointe manque (obligatoire depuis une version en attente, A-811)"; exit 1; }
          if [[ "$vus" == *" parts_yahoo "* || "$vus" == *" lot_yahoo "* ]] && [ "$SERIE" != "toutes" ] && [ "$SERIE" != "Yahoo" ]; then
            echo "::error::DEMANDE REFUSEE : elle regle la serie Yahoo, qu'elle ne joue pas (serie $SERIE)"
            exit 1
          fi
          if [[ "$vus" == *" parts_hl "* || "$vus" == *" lot_hl "* ]] && [ "$SERIE" != "toutes" ] && [ "$SERIE" != "HL" ]; then
            echo "::error::DEMANDE REFUSEE : elle regle la serie HL, qu'elle ne joue pas (serie $SERIE)"
            exit 1
          fi
          if [[ "$vus" == *" parts_boucle "* || "$vus" == *" lot_boucle "* ]] && [ "$SERIE" != "toutes" ] && [ "$SERIE" != "Boucle" ]; then
            echo "::error::DEMANDE REFUSEE : elle regle la serie Boucle, qu'elle ne joue pas (serie $SERIE)"
            exit 1
          fi
          if [[ "$vus" == *" parts_signaux "* || "$vus" == *" lot_signaux "* ]] && [ "$SERIE" != "toutes" ] && [ "$SERIE" != "Signaux" ]; then
            echo "::error::DEMANDE REFUSEE : elle regle la serie Signaux, qu'elle ne joue pas (serie $SERIE)"
            exit 1
          fi
          if [[ "$vus" == *" parts_debuts "* || "$vus" == *" lot_debuts "* ]] && [ "$SERIE" != "toutes" ] && [ "$SERIE" != "Debuts" ]; then
            echo "::error::DEMANDE REFUSEE : elle regle la serie Debuts, qu'elle ne joue pas (serie $SERIE)"
            exit 1
          fi
          if [[ "$vus" == *" parts_signal "* || "$vus" == *" lot_signal "* ]] && [ "$SERIE" != "toutes" ] && [ "$SERIE" != "Signal" ]; then
            echo "::error::DEMANDE REFUSEE : elle regle la serie Signal, qu'elle ne joue pas (serie $SERIE)"
            exit 1
          fi
          git show "$APRES:.github/workflows/$FICHIER" > "$S/fiche" 2>/dev/null || { echo "::error::DEMANDE REFUSEE : la fiche du circuit $FICHIER est absente de cette branche"; exit 1; }
          awk -v groupe="" '/^concurrency:/ { dans = 1; next } dans && /^[^ #]/ { dans = 0 } dans && /^  queue: max[[:space:]]*$/ { file = 1 } dans && /^  cancel-in-progress:/ && !/^  cancel-in-progress:[[:space:]]*false[[:space:]]*$/ { annule = 1 } dans && $0 == "  group: " groupe { nomme = 1 } END { exit !(file && !annule && (groupe == "" || nomme)) }' "$S/fiche" || { echo "::error::DEMANDE REFUSEE : la fiche du circuit $FICHIER sur cette branche n'est pas une file (queue: max, sans cancel-in-progress: true) ; lancee, elle annulerait un passage du groupe"; exit 1; }
          git show "$APRES:.github/workflows/demande_de_serie.yml" > "$S/relais" 2>/dev/null || { echo "::error::DEMANDE REFUSEE : le relais est absent de cette branche"; exit 1; }
          awk -v groupe='demande-de-serie-en-file' '/^concurrency:/ { dans = 1; next } dans && /^[^ #]/ { dans = 0 } dans && /^  queue: max[[:space:]]*$/ { file = 1 } dans && /^  cancel-in-progress:/ && !/^  cancel-in-progress:[[:space:]]*false[[:space:]]*$/ { annule = 1 } dans && $0 == "  group: " groupe { nomme = 1 } END { exit !(file && !annule && (groupe == "" || nomme)) }' "$S/relais" || { echo "::error::DEMANDE REFUSEE : le relais de cette branche n'est pas une file du groupe demande-de-serie-en-file (relais ancien ? une demande y annulerait en silence une demande en attente) : publier d'abord le relais neuf sur cette branche"; exit 1; }
          if [ "$CIRCUIT" = "epreuve" ]; then
            if [ "$EPREUVES" = "toutes" ]; then NOMBRE=54; else IFS=, read -ra liste <<<"$EPREUVES"; NOMBRE=${#liste[@]}; fi
          elif [ "$CIRCUIT" = "series" ]; then
            NOMBRE=0
            if [ "$SERIE" = "toutes" ] || [ "$SERIE" = "Yahoo" ]; then NOMBRE=$(( NOMBRE + PARTS_YAHOO )); fi
            if [ "$SERIE" = "toutes" ] || [ "$SERIE" = "HL" ]; then NOMBRE=$(( NOMBRE + PARTS_HL )); fi
            if [ "$SERIE" = "toutes" ] || [ "$SERIE" = "Boucle" ]; then NOMBRE=$(( NOMBRE + PARTS_BOUCLE )); fi
            if [ "$SERIE" = "toutes" ] || [ "$SERIE" = "Signaux" ]; then NOMBRE=$(( NOMBRE + PARTS_SIGNAUX )); fi
            if [ "$SERIE" = "toutes" ] || [ "$SERIE" = "Debuts" ]; then NOMBRE=$(( NOMBRE + PARTS_DEBUTS )); fi
            if [ "$SERIE" = "toutes" ] || [ "$SERIE" = "Signal" ]; then NOMBRE=$(( NOMBRE + PARTS_SIGNAL )); fi
          else
            NOMBRE=18
          fi
          echo "demande $fichier : circuit $CIRCUIT ($FICHIER) ; jobs $NOMBRE ; version $BRANCHE ; pointe ${POINTE:-actuelle} ; serie $SERIE ; parts_yahoo $PARTS_YAHOO ; lot_yahoo $LOT_YAHOO ; parts_hl $PARTS_HL ; lot_hl $LOT_HL ; parts_boucle $PARTS_BOUCLE ; lot_boucle $LOT_BOUCLE ; parts_signaux $PARTS_SIGNAUX ; lot_signaux $LOT_SIGNAUX ; parts_debuts $PARTS_DEBUTS ; lot_debuts $LOT_DEBUTS ; parts_signal $PARTS_SIGNAL ; lot_signal $LOT_SIGNAL ; epreuves $EPREUVES ; a blanc $A_BLANC"
          printf '%s\n' "$fichier" > "$S/fichier"
          printf '%s\n' "$FICHIER" > "$S/circuit"
          printf '%s\n' "$CIRCUIT" > "$S/nom_du_circuit"
          printf '%s\n' "$NOMBRE" > "$S/nombre"
          printf '%s\n' "$A_BLANC" > "$S/a_blanc"
          if [ "$CIRCUIT" = "epreuve" ]; then
            printf '%s\n' "$FICHIER" --ref "$BRANCHE" -f "version=$BRANCHE" -f "pointe=$POINTE" -f "epreuves=$EPREUVES" > "$S/args"
          elif [ "$CIRCUIT" != "series" ]; then
            printf '%s\n' "$FICHIER" --ref "$BRANCHE" > "$S/args"
          else
            printf '%s\n' "$FICHIER" --ref "$BRANCHE" -f "version=$BRANCHE" -f "pointe=$POINTE" -f "serie=$SERIE" -f "parts_yahoo=$PARTS_YAHOO" -f "lot_yahoo=$LOT_YAHOO" -f "parts_hl=$PARTS_HL" -f "lot_hl=$LOT_HL" -f "parts_boucle=$PARTS_BOUCLE" -f "lot_boucle=$LOT_BOUCLE" -f "parts_signaux=$PARTS_SIGNAUX" -f "lot_signaux=$LOT_SIGNAUX" -f "parts_debuts=$PARTS_DEBUTS" -f "lot_debuts=$LOT_DEBUTS" -f "parts_signal=$PARTS_SIGNAL" -f "lot_signal=$LOT_SIGNAL" > "$S/args"
          fi
          }
          # au bouton : la demande examinée est celle qu'ajoute le dernier commit de la branche
          if [ "$EVENEMENT" = "workflow_dispatch" ]; then
            AVANT=$(git rev-parse -q --verify "$APRES^1") || { echo "::error::DEMANDE REFUSEE : le dernier commit de la branche n'a pas de parent lisible"; exit 1; }
          fi
          ( examiner "$AVANT" "$APRES" "$BRANCHE" "$D/demande" ) || exit 1
          f=$(cat "$D/demande/fichier")
          h="${f#demandes/DEMANDE_}"
          id="DEMANDE_${h%.txt}@${BRANCHE}"
          FICHIER=$(cat "$D/demande/circuit")
          CIRCUIT=$(cat "$D/demande/nom_du_circuit")
          NOMBRE=$(cat "$D/demande/nombre")
          declare -a PLACES=()
          if [[ " series_longues.yml epreuves_longues.yml certifier_la_version.yml " == *" $FICHIER "* ]]; then
            # ETAPE FILE-2 (main, 20-11-2026) : LES PLACES de cette demande, jamais un refus. La charge de chaque place
            # lue dans le titre des passages en cours ou en attente des trois circuits longs (un titre sans places,
            # passage lance a la main avant l'etape FILE-2, est ignore) ; la fenetre de places consecutives la moins
            # chargee. Le reservoir est borne par les groupes de job, pas par ce choix : ce choix ne fait que repartir.
            : > "$D/passages"
            for F in series_longues.yml epreuves_longues.yml certifier_la_version.yml; do
              gh run list --workflow "$F" --limit 100 --json status,displayTitle --jq '.[] | select(.status != "completed") | .displayTitle' >> "$D/passages" 2>"$D/erreur_gh" || {
                if grep -qi "could not find" "$D/erreur_gh"; then echo "::error::DEMANDE REFUSEE : le circuit $F est inconnu de GitHub au depot public (le relais et $F s installent dans la meme publication, puis une demande a_blanc=oui)"; else echo "::error::DEMANDE REFUSEE : passages de $F illisibles"; fi
                exit 1; }
            done
            M=18
            declare -a charge=()
            for (( k = 1; k <= M; k++ )); do charge[k]=0; done
            while IFS= read -r t; do
              if [[ "$t" =~ \ places\ ([1-9][0-9]?)\+([1-9][0-9]{0,2})$ ]] && [ "${BASH_REMATCH[1]}" -ge 1 ] && [ "${BASH_REMATCH[1]}" -le "$M" ] && [ "${BASH_REMATCH[2]}" -ge 1 ]; then
                p="${BASH_REMATCH[1]}"; n="${BASH_REMATCH[2]}"; [ "$n" -le "$M" ] || n="$M"
                for (( i = 0; i < n; i++ )); do k=$(( (p - 1 + i) % M + 1 )); charge[k]=$(( charge[k] + 1 )); done
              fi
            done < "$D/passages"
            if [ "$CIRCUIT" != "epreuve" ] && [ "$CIRCUIT" != "series" ]; then
              PREMIERE=1
            else
              w="$NOMBRE"; [ "$w" -le "$M" ] || w="$M"; [ "$w" -ge 1 ] || w=1
              meilleure=""
              for (( p = 1; p <= M; p++ )); do
                somme=0
                for (( i = 0; i < w; i++ )); do somme=$(( somme + charge[(p - 1 + i) % M + 1] )); done
                if [ -z "$meilleure" ] || [ "$somme" -lt "$meilleure" ]; then meilleure="$somme"; PREMIERE="$p"; fi
              done
            fi
            echo "places $PREMIERE+$NOMBRE (jobs en cours ou en attente par place :$(for (( k = 1; k <= M; k++ )); do printf ' %s=%s' "$k" "${charge[k]}"; done)) ; un job attend sur sa place si elle est occupee"
            PLACES=(-f "premiere_place=$PREMIERE" -f "nombre_de_places=$NOMBRE")
          fi
          if [ "$(cat "$D/demande/a_blanc")" = "oui" ]; then
            echo "A BLANC : rien n'est lance ($id)"
            exit 0
          fi
          mapfile -t ARGS < "$D/demande/args"
          gh workflow run "${ARGS[@]}" "${PLACES[@]}" -f "demande=$id" || { echo "::error::LANCEMENT REFUSE PAR GITHUB : $(head -1 "$D/demande/args") ($id)"; exit 1; }
          echo "LANCE : $(head -1 "$D/demande/args") sur $BRANCHE ($id) ; GitHub le met en file s'il le faut"
