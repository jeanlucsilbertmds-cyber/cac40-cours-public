name: Essai des Pythons (A-893)
on:
  push:
    branches: [essai-pythons]
    paths: [".github/workflows/essai_pythons.yml"]
permissions:
  contents: read
jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Avant toute pose
        run: |
          echo "python3 : $(command -v python3) $(python3 --version 2>&1)"
          for v in 3.8 3.9 3.10 3.11 3.12 3.13 3.14; do echo "python$v : $(command -v python$v || echo absent)"; done
          ls -l /usr/bin/python3* /usr/local/bin/python3* 2>&1 || true
          date +%s > /tmp/t0
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.13
            3.11
      - name: Apres la pose
        run: |
          echo "duree de la pose : $(( $(date +%s) - $(cat /tmp/t0) )) s"
          echo "python3 : $(command -v python3) $(python3 --version 2>&1)"
          python3 -c "import sys; print('version_info', sys.version_info[:3])"
          for v in 3.11 3.12 3.13; do echo "python$v : $(command -v python$v || echo absent) $(python$v --version 2>&1 || true)"; done
